<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tile Slide</title>
<meta name="description" content="Tile Slide is a cheerful sliding number puzzle for Android by Jelle Gijsbers.">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#1B5FA8;--ink:#FFFFFF;--navy:#1B1446;--sun:#FFD23F;--soft:#CFE4FA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 30%,#3E8FE0,var(--bg) 60%,#123F7A);color:var(--ink);
  font-family:"Nunito",system-ui,sans-serif;display:grid;place-items:center;padding:32px 16px}
main{max-width:34rem;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
img{width:132px;height:132px;border-radius:30px;box-shadow:0 8px 0 var(--navy)}
h1{margin:0;font-family:"Lilita One",system-ui,sans-serif;font-weight:400;font-size:clamp(2.6rem,10vw,3.6rem);line-height:1;
  -webkit-text-stroke:8px var(--navy);paint-order:stroke fill;text-shadow:0 6px 0 var(--navy);color:var(--sun)}
p{margin:0;font-weight:600;color:var(--soft);font-size:1.1rem;line-height:1.5}
nav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
a{color:var(--navy);background:var(--sun);border:3px solid var(--navy);box-shadow:0 4px 0 var(--navy);border-radius:999px;
  padding:10px 18px;font-weight:800;text-decoration:none}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
small{color:var(--soft);font-weight:600}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="Tile Slide app icon">
  <h1>Tile Slide</h1>
  <p>A cheerful sliding number puzzle for Android: 1000 levels in 52 colourful worlds, from 3×3 to 7×7.</p>
  <nav>
    <a href="privacy.html">Privacy Policy</a>
    <a href="privacy.html#nl">Privacybeleid (NL)</a>
  </nav>
  <small>Made by Jelle Gijsbers · gjelle974@gmail.com</small>
</main>
</body>
</html>
